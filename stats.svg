  <text y="6" text-anchor="middle" font-size="26" font-weight="800" fill="#f5e6c8" class="fade" style="animation-delay:600ms">55</text>
  <text y="26" text-anchor="middle" font-size="11" letter-spacing="1" fill="#8b949e">CONTRIBS</text>

<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" fill="none">
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .fade { opacity: 0; animation: fade .7s ease forwards; }
  @keyframes fade { to { opacity: 1; } }
  .ring { animation: ring 1.4s cubic-bezier(.2,.8,.2,1) forwards; stroke-dashoffset: 326.7; }
  @keyframes ring { to { stroke-dashoffset: 290.8; } }
</style>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d4b483" stop-opacity="0"/><stop offset=".5" stop-color="#d4b483"/><stop offset="1" stop-color="#d4b483" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x=".5" y=".5" width="494" height="209" rx="12" fill="#0d1117" stroke="#2a2418"/>
<rect x="40" y="0" width="415" height="1.5" fill="url(#edge)"/>
<text x="24" y="38" font-size="16" font-weight="700" letter-spacing="1.5" fill="#d4b483">STATS</text>
<text x="471" y="38" text-anchor="end" font-size="15" fill="#8b949e" opacity=".6" font-family="'Yu Mincho','MS Mincho','Noto Serif CJK JP',serif">統計</text>
<g class="fade" style="animation-delay:150ms">
  <text x="28" y="84" font-size="13" fill="#d4b483">★</text>

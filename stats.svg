  <text x="290" y="111" text-anchor="end" font-size="14" font-weight="700" fill="#f5e6c8">48</text>
</g>
<g class="fade" style="animation-delay:390ms">
  <text x="28" y="138" font-size="13" fill="#d4b483">⇄</text>
  <text x="50" y="138" font-size="14" fill="#c9d1d9">Pull requests</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset=".62" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1c160c"/>
    </linearGradient>
    <radialGradient id="moon" cx=".38" cy=".34" r=".72">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset=".55" stop-color="#e9cf9b"/>
      <stop offset="1" stop-color="#b08a52"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#d4b483" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#d4b483" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d4b483" stop-opacity="0"/>
    </radialGradient>
    <!-- moving shine across the name -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0" stop-color="#d4b483"/>
      <stop offset=".5" stop-color="#fff7e4"/>
      <stop offset="1" stop-color="#d4b483"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-400 0;1100 0;1100 0" keyTimes="0;.55;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4b483" stop-opacity="0"/>
      <stop offset=".15" stop-color="#d4b483"/>
      <stop offset="1" stop-color="#f5e6c8" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b483" stop-opacity="0"/>
      <stop offset="1" stop-color="#d4b483" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4b483" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d4b483"/>
      <stop offset="1" stop-color="#d4b483" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f5e6c8">
    <circle cx="60" cy="40" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="28" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="62" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="22" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="70" r="1.2"><animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="34" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="88" r="1"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="20" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="46" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="110" r="1"><animate attributeName="opacity" values=".5;1;.5" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="180" r="1.2"><animate attributeName="opacity" values="1;.3;1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="150" r="1"><animate attributeName="opacity" values=".2;.8;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="120" r="1"><animate attributeName="opacity" values=".6;.1;.6" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="130" r="1"><animate attributeName="opacity" values=".2;.7;.2" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="930" cy="165" r="230" fill="url(#halo)">
    <animate attributeName="r" values="220;240;220" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="165" r="105" fill="url(#moon)"/>
  <g fill="#8a6a3c" opacity=".12">
    <circle cx="895" cy="140" r="18"/>
    <circle cx="960" cy="200" r="12"/>
    <circle cx="975" cy="130" r="7"/>
    <circle cx="905" cy="215" r="6"/>
  </g>
  <!-- drifting clouds across the moon -->
  <g fill="#0d1117" opacity=".85">
    <rect x="780" y="150" width="190" height="8" rx="4">
      <animate attributeName="x" values="760;860;760" dur="14s" repeatCount="indefinite"/>
    </rect>
    <rect x="880" y="176" width="150" height="6" rx="3">
      <animate attributeName="x" values="920;830;920" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- mountains -->
  <path d="M0 400 L0 292 L110 250 L200 282 L330 212 L460 278 L590 236 L720 296 L850 228 L990 282 L1100 238 L1200 262 L1200 400 Z" fill="#17130d"/>
  <rect y="250" width="1200" height="80" fill="url(#mist)"/>
  <path d="M0 400 L0 336 L150 312 L300 338 L470 300 L620 334 L780 306 L930 296 L1060 322 L1200 300 L1200 400 Z" fill="#0a0c10"/>

  <!-- torii silhouetted against the moon -->
  <g fill="#0a0c10" transform="translate(930 298)">
    <path d="M-62 -78 Q0 -70 62 -78 L66 -88 Q0 -80 -66 -88 Z"/>
    <rect x="-50" y="-66" width="100" height="6"/>
    <rect x="-40" y="-76" width="8" height="78"/>
    <rect x="32" y="-76" width="8" height="78"/>
    <rect x="-4" y="-76" width="8" height="12"/>
  </g>

  <!-- falling petals -->
  <g>
    <g><animateTransform attributeName="transform" type="translate" from="620 -20" to="380 420" dur="11s" repeatCount="indefinite"/>
      <ellipse rx="5" ry="3" fill="#e2b3a8" opacity=".85"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" from="820 -20" to="560 420" dur="14s" begin="-4s" repeatCount="indefinite"/>
      <ellipse rx="4" ry="2.5" fill="#d4b483" opacity=".8"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" from="1050 -20" to="780 420" dur="12s" begin="-8s" repeatCount="indefinite"/>
      <ellipse rx="5" ry="3" fill="#e2b3a8" opacity=".7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.6s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" from="1180 -20" to="900 420" dur="16s" begin="-2s" repeatCount="indefinite"/>
      <ellipse rx="3.5" ry="2" fill="#f5e6c8" opacity=".7"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3.4s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" from="720 -20" to="470 420" dur="13s" begin="-10s" repeatCount="indefinite"/>
      <ellipse rx="4.5" ry="2.8" fill="#e2b3a8" opacity=".75"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.8s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" from="960 -20" to="690 420" dur="15s" begin="-6s" repeatCount="indefinite"/>
      <ellipse rx="4" ry="2.4" fill="#d4b483" opacity=".7"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2.9s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" from="480 -20" to="250 420" dur="17s" begin="-12s" repeatCount="indefinite"/>
      <ellipse rx="3.5" ry="2" fill="#e2b3a8" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite"/></ellipse></g>
  </g>

  <!-- hanko seal -->
  <g transform="translate(112 100) rotate(-5)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur=".15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="1.8;.94;1" keyTimes="0;.7;1" begin="1.3s" dur=".35s" fill="freeze"/>
      <rect x="-32" y="-32" width="64" height="64" rx="8" fill="#a8322a"/>
      <rect x="-27" y="-27" width="54" height="54" rx="5" fill="none" stroke="#f5e6c8" stroke-opacity=".55" stroke-width="1.5"/>
      <text x="0" y="-3" text-anchor="middle" font-family="'Yu Mincho','MS Mincho','Noto Serif CJK JP','Hiragino Mincho ProN',serif" font-size="24" font-weight="700" fill="#f5e6c8">浪</text>
      <text x="0" y="23" text-anchor="middle" font-family="'Yu Mincho','MS Mincho','Noto Serif CJK JP','Hiragino Mincho ProN',serif" font-size="24" font-weight="700" fill="#f5e6c8">人</text>
    </g>
  </g>
  <text x="162" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="5" fill="#8b949e" opacity="0">RONIN · CODE · EST. 2023
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur=".8s" fill="freeze"/>
  </text>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-30 0" to="0 0" dur="1.1s" fill="freeze"/>
    <text x="80" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="-2" fill="url(#gold)">JustGenios</text>
  </g>

  <!-- katana slash -->
  <path d="M82 240 L640 240" stroke="url(#blade)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="560" stroke-dashoffset="560">
    <animate attributeName="stroke-dashoffset" from="560" to="0" begin=".6s" dur=".7s" fill="freeze"/>
  </path>
  <ellipse cx="82" cy="240" rx="18" ry="2" fill="#fff7e4" filter="url(#glow)" opacity="0">
    <animate attributeName="cx" values="82;640" begin="1.4s;glint.end+3s" dur="1.4s" id="glint"/>
    <animate attributeName="opacity" values="0;1;0" begin="1.4s;glint.end+3s" dur="1.4s"/>
  </ellipse>

  <!-- subtitle -->
  <text x="84" y="282" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="7" fill="#d4b483" opacity="0">FULL-STACK DEVELOPER
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur=".8s" fill="freeze"/>
  </text>
  <text x="84" y="316" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="17" fill="#8b949e" opacity="0">Go  ·  TypeScript  ·  Dart  ·  Flutter
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur=".8s" fill="freeze"/>
  </text>

  <rect y="398" width="1200" height="2" fill="url(#rule)"/>
</svg>
